name: Build LESSON 9 HTML

on:
  push:
    paths:
      - 'payload.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore index.html
        run: |
          base64 --decode payload.b64 | gunzip > index.html
          test -s index.html
          grep -q 'LESSON 9 詳説・誤答分析' index.html
      - name: Commit generated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Publish LESSON 9 detailed explanation'
            git push
          fi
