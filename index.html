<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LESSON 9｜クリック型 詳説・誤答分析</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827}iframe{display:block;width:100%;height:100%;border:0;background:#111827}</style></head><body><iframe id="deck" src="static.html" title="LESSON 9 クリック型授業"></iframe><script>(()=>{const f=document.getElementById('deck');f.addEventListener('load',()=>{const d=f.contentDocument,w=f.contentWindow;if(!d)return;d.title='LESSON 9｜クリック型 詳説・誤答分析';const css=d.createElement('style');css.textContent=`html,body{width:100%!important;height:100%!important;overflow:hidden!important;background:#111827!important}body{display:flex!important;align-items:center!important;justify-content:center!important;user-select:none!important;-webkit-user-select:none!important}.deck-stage{position:relative;width:1280px;height:720px;transform-origin:center center}.deck-stage .slide{display:none!important;position:absolute!important;inset:0!important;border-bottom:0!important;cursor:pointer}.deck-stage .slide.is-active{display:block!important}.deck-stage [data-interactive="true"] [data-reveal]{display:none!important}.deck-stage [data-interactive="true"][data-stage="1"] [data-reveal="1"],.deck-stage [data-interactive="true"][data-stage="2"] [data-reveal="1"],.deck-stage [data-interactive="true"][data-stage="3"] [data-reveal="1"],.deck-stage [data-interactive="true"][data-stage="4"] [data-reveal="1"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="2"] [data-reveal="2"],.deck-stage [data-interactive="true"][data-stage="3"] [data-reveal="2"],.deck-stage [data-interactive="true"][data-stage="4"] [data-reveal="2"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="3"] [data-reveal="3"],.deck-stage [data-interactive="true"][data-stage="4"] [data-reveal="3"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="4"] [data-reveal="4"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="2"] .grid{grid-template-columns:1fr!important}.deck-stage [data-interactive="true"][data-stage="3"] .grid{grid-template-columns:1fr 1.2fr!important}.deck-stage [data-interactive="true"][data-stage="4"] .grid{grid-template-columns:1.05fr 1.3fr 1fr!important}.deck-stage [data-interactive="true"][data-stage="1"] .answer-badge{left:54px!important;right:54px!important;top:auto!important;bottom:86px!important;max-width:none!important;text-align:left!important;font-size:23px!important;line-height:1.35!important;padding:17px 22px!important}.deck-stage [data-interactive="true"][data-stage="2"] .answer-badge,.deck-stage [data-interactive="true"][data-stage="3"] .answer-badge,.deck-stage [data-interactive="true"][data-stage="4"] .answer-badge{left:auto!important;right:56px!important;top:35px!important;bottom:auto!important;max-width:700px!important;text-align:right!important;font-size:16px!important;line-height:1.25!important;padding:8px 13px!important;z-index:10}.choice.is-correct{background:#2e7d57!important;border-color:#9be0b7!important;color:#fff!important;box-shadow:0 0 0 3px rgba(155,224,183,.22)!important}.deck-ui{position:fixed;inset:0;pointer-events:none;z-index:9999;font-family:'Noto Sans JP',system-ui,sans-serif}.deck-progress{position:absolute;top:12px;left:14px;padding:6px 10px;border-radius:999px;background:rgba(15,23,42,.72);color:#fff;font-size:13px;font-weight:900;backdrop-filter:blur(8px)}.deck-step{position:absolute;top:12px;right:14px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#14213d;font-size:13px;font-weight:900;box-shadow:0 8px 22px rgba(0,0,0,.15)}.deck-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:rgba(15,23,42,.6);color:#fff;font-size:11px;font-weight:800;opacity:.72;white-space:nowrap}.deck-nav{pointer-events:auto;position:absolute;top:50%;width:42px;height:64px;margin-top:-32px;border:0;border-radius:13px;background:rgba(15,23,42,.5);color:#fff;font-size:30px;cursor:pointer;opacity:.42}.deck-nav:hover{opacity:.95}.deck-nav.prev{left:10px}.deck-nav.next{right:10px}@media(max-width:900px){.deck-progress,.deck-step{top:5px;font-size:10px;padding:4px 7px}.deck-hint{bottom:4px;font-size:9px}.deck-nav{width:30px;height:48px;font-size:22px}}`;d.head.appendChild(css);const slides=[...d.querySelectorAll('section.slide')],stage=d.createElement('div');stage.className='deck-stage';stage.id='deckStage';slides[0].parentNode.insertBefore(stage,slides[0]);slides.forEach(s=>stage.appendChild(s));slides.forEach(s=>{if(s.querySelector('.qbox')){s.dataset.interactive='true';s.dataset.stage='0';const a=s.querySelector('.answer-badge'),c=s.querySelector('.card.correct'),x=s.querySelector('.card.wrong'),o=s.querySelector('.card.output');if(a)a.dataset.reveal='1';if(c)c.dataset.reveal='2';if(x)x.dataset.reveal='3';if(o)o.dataset.reveal='4'}});const cover=slides[0],lead=cover.querySelector('.lead'),big=cover.querySelector('.big p');if(lead)lead.innerHTML='問題を見て考える → <b>クリックで正解・根拠・誤答分析・型を段階表示</b>する授業用デッキ。';if(big)big.textContent='問題スライドでは、クリック／Spaceで「正解 → 正解の根拠 → 誤答分析 → 再利用する型・完成英文」の順に表示します。← → キーで前後の問題へ移動できます。';const last=slides[slides.length-1],cards=last.querySelectorAll('.wide-card');if(cards[1]){const h=cards[1].querySelector('h2'),u=cards[1].querySelector('ul');if(h)h.textContent='クリック型の操作';if(u)u.innerHTML='<li>クリック1回目：正解。2回目：正解の根拠。3回目：誤答分析。4回目：再利用する型／完成英文。</li><li>Spaceキーでも同じ段階表示。← → キーで前後へ。Rキーでその問題を初期状態に戻す。</li>'}const ui=d.createElement('div');ui.className='deck-ui';ui.innerHTML='<div class="deck-progress" id="deckProgress"></div><div class="deck-step" id="deckStep"></div><div class="deck-hint" id="deckHint"></div><button class="deck-nav prev" id="prevSlide" type="button">‹</button><button class="deck-nav next" id="nextSlide" type="button">›</button>';d.body.appendChild(ui);const pg=d.getElementById('deckProgress'),se=d.getElementById('deckStep'),hi=d.getElementById('deckHint');let i=0;const labs=['問題','正解','正解の根拠','誤答分析','型・完成英文'];function fit(){const z=Math.min(w.innerWidth/1280,w.innerHeight/720);stage.style.transform=`scale(${z})`}function st(s){return Number(s.dataset.stage||0)}function mark(s,on){s.querySelectorAll('.choice').forEach(e=>e.classList.remove('is-correct'));if(!on)return;const a=s.querySelector('.answer-badge');if(!a)return;const m=a.textContent.match(/正解[：:]\s*([①②③④⑤⑥⑦⑧])/);if(!m)return;const t=[...s.querySelectorAll('.choice')].find(e=>e.textContent.trim().startsWith(m[1]));if(t)t.classList.add('is-correct')}function set(s,n){if(s.dataset.interactive!=='true')return;n=Math.max(0,Math.min(4,n));s.dataset.stage=String(n);mark(s,n>=1)}function render(){slides.forEach((s,j)=>s.classList.toggle('is-active',j===i));const s=slides[i];pg.textContent=`${i+1} / ${slides.length}`;if(s.dataset.interactive==='true'){const n=st(s);se.textContent=`${n}/4  ${labs[n]}`;hi.textContent=n<4?'クリック / Space：次の段階　← →：前後':'クリック / Space：次の問題　R：リセット'}else{se.textContent=i===0?'START':'GUIDE';hi.textContent='クリック / Space：次へ　← →：前後'}}function go(n){i=Math.max(0,Math.min(slides.length-1,n));render()}function next(){const s=slides[i];if(s.dataset.interactive==='true'&&st(s)<4){set(s,st(s)+1);render()}else go(i+1)}stage.addEventListener('click',e=>{if(!e.target.closest('button,a'))next()});d.getElementById('prevSlide').onclick=e=>{e.stopPropagation();go(i-1)};d.getElementById('nextSlide').onclick=e=>{e.stopPropagation();go(i+1)};d.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(d.activeElement?.tagName))return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();next()}else if(e.key==='ArrowRight'){e.preventDefault();go(i+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(i-1)}else if(e.key.toLowerCase()==='r'){e.preventDefault();set(slides[i],0);render()}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slides.length-1)}});w.addEventListener('resize',fit);fit();render()})})();</script></body></html>
