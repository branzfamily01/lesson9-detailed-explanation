<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LESSON 9｜クリック型 詳説・誤答分析</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827}iframe{display:block;width:100%;height:100%;border:0;background:#111827}</style></head><body><iframe id="deck" src="static.html" title="LESSON 9 クリック型授業"></iframe><script>(()=>{const translations={"1-(1)":"特殊な形が，らくだが砂漠で生きていく助けになっている．","1-(2)":"その交通事故は，ひどい道路修理の結果だったように思われる．","1-(3)":"そのような単純なミスをするとは，なんて私はばかなのでしょう．","1-(4)":"両親が晩に外出したときはいつも，私は弟の面倒をみる仕事をしたものでした．","1-(5)":"これらの本はすべてトムのものです．それらのどれも私のものではありません．","1-(6)":"彼は，たとえあるとしても，国際政治に対する興味は少なかった．","1-(7)":"そういうわけで私の母は彼のことをよく思っていなかった．","1-(8)":"私の宿題を終わらせようと30分を費やしたが，終わらせるためにはもう30分必要です．","1-(9)":"彼はなぜ同じ手順をたどる必要があるのでしょうか．","1-(10)":"私たちとは文化が違う人々に会うのはおもしろい．","1-(11)":"あなたはタクシーに乗ったほうがいい．そうでないと遅れるでしょう．","1-(12)":"それはとてもよい講演だったので観客席はいっぱいでした．","1-(13)":"この値段は大部分の消費者の手の届く範囲をはるかに超えている．","1-(14)":"昨日のコンサートには4,000人もの観客がいました．","1-(15)":"父は年をとるにつれて涙もろくなりました．","2-(1)":"議論の間，私は彼を支持した．","2-(2)":"彼は数分前に廊下でケイトに出くわした．","2-(3)":"接近する台風のために彼らは野外コンサートを中止することに決めました．","2-(4)":"サラは何でも知っているふりをしました．","2-(5)":"日本の航空会社は特別運賃を提供したが，アメリカのほうが，安い空の旅に関してはすばらしい（天国のようだ）．","2-(6)":"気候は徐々に涼しくなり，人々に近づく秋の気配をもたらしている．","2-(7)":"彼は以前，この会社の社長でした．","3-(1)":"彼らは結婚して3年になる．","3-(2)":"あなたはシドニーの私の友達を訪ねるべきでした．","3-(3)":"彼女はベストを尽くしたが，再び失敗した．","3-(4)":"彼は若いけれども，そのような場合大人はどうすべきかをわかっている．","3-(5)":"頭痛で一晩中起きていた．","4-(1)":"幸せな夫婦は，何もする必要なしに一緒にいる方法を学んでいる．","4-(2)":"よい関係とはわくわくするような活動がすべてではない．","4-(3)":"よい関係とは，人が同時に同じ部屋にいて，何もしなくても心地よいと感じるということだ．","4-(4)":"相手を楽しませようとするのはやめよう．","4-(5)":"あなたたちの人間関係を楽しく面白いものにしようとするのはやめよう．"};const f=document.getElementById('deck');f.addEventListener('load',()=>{const d=f.contentDocument,w=f.contentWindow;if(!d)return;d.title='LESSON 9｜クリック型 詳説・誤答分析';const css=d.createElement('style');css.textContent=`html,body{width:100%!important;height:100%!important;overflow:hidden!important;background:#111827!important}body{display:flex!important;align-items:center!important;justify-content:center!important;user-select:none!important;-webkit-user-select:none!important}.deck-stage{position:relative;width:1280px;height:720px;transform-origin:center center}.deck-stage .slide{display:none!important;position:absolute!important;inset:0!important;border-bottom:0!important;cursor:pointer}.deck-stage .slide.is-active{display:block!important}.deck-stage [data-interactive="true"] [data-reveal]{display:none!important}.deck-stage [data-interactive="true"][data-stage="1"] [data-reveal="1"],.deck-stage [data-interactive="true"][data-stage="2"] [data-reveal="1"],.deck-stage [data-interactive="true"][data-stage="3"] [data-reveal="1"],.deck-stage [data-interactive="true"][data-stage="4"] [data-reveal="1"],.deck-stage [data-interactive="true"][data-stage="5"] [data-reveal="1"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="2"] [data-reveal="2"],.deck-stage [data-interactive="true"][data-stage="3"] [data-reveal="2"],.deck-stage [data-interactive="true"][data-stage="4"] [data-reveal="2"],.deck-stage [data-interactive="true"][data-stage="5"] [data-reveal="2"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="3"] [data-reveal="3"],.deck-stage [data-interactive="true"][data-stage="4"] [data-reveal="3"],.deck-stage [data-interactive="true"][data-stage="5"] [data-reveal="3"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="4"] [data-reveal="4"],.deck-stage [data-interactive="true"][data-stage="5"] [data-reveal="4"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="5"] [data-reveal="5"]{display:block!important}.deck-stage [data-interactive="true"][data-stage="2"] .grid{grid-template-columns:1fr!important}.deck-stage [data-interactive="true"][data-stage="3"] .grid{grid-template-columns:1fr 1.2fr!important}.deck-stage [data-interactive="true"][data-stage="4"] .grid,.deck-stage [data-interactive="true"][data-stage="5"] .grid{grid-template-columns:1.05fr 1.3fr 1fr!important}.translation-card{background:#eef7ff;border:1px solid #b9d7ee;border-left:9px solid #3d7ea6;border-radius:18px;padding:12px 18px;margin-top:12px;box-shadow:0 10px 22px rgba(29,53,87,.07)}.translation-card h2{margin:0 0 5px;color:#1d4f6e;font-size:19px;font-weight:900}.translation-card p{margin:0;font-size:19px;line-height:1.42;font-weight:750;color:#20324a}.deck-stage .answer-badge{max-width:720px!important;line-height:1.25!important;font-size:18px!important;text-align:right!important;z-index:10}.choice.is-correct{background:#2e7d57!important;border-color:#9be0b7!important;color:#fff!important;box-shadow:0 0 0 3px rgba(155,224,183,.22)!important}.deck-ui{position:fixed;inset:0;pointer-events:none;z-index:9999;font-family:'Noto Sans JP',system-ui,sans-serif}.deck-progress{position:absolute;top:12px;left:14px;padding:6px 10px;border-radius:999px;background:rgba(15,23,42,.72);color:#fff;font-size:13px;font-weight:900}.deck-step{position:absolute;top:12px;right:14px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#14213d;font-size:13px;font-weight:900}.deck-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:rgba(15,23,42,.6);color:#fff;font-size:11px;font-weight:800;opacity:.72;white-space:nowrap}.deck-nav{pointer-events:auto;position:absolute;top:50%;width:42px;height:64px;margin-top:-32px;border:0;border-radius:13px;background:rgba(15,23,42,.5);color:#fff;font-size:30px;cursor:pointer;opacity:.42}.deck-nav:hover{opacity:.95}.deck-nav.prev{left:10px}.deck-nav.next{right:10px}`;d.head.appendChild(css);const slides=[...d.querySelectorAll('section.slide')],stage=d.createElement('div');stage.className='deck-stage';slides[0].parentNode.insertBefore(stage,slides[0]);slides.forEach(s=>stage.appendChild(s));slides.forEach(s=>{if(s.querySelector('.qbox')){s.dataset.interactive='true';s.dataset.stage='0';const old=s.dataset.title||'',num=(old.match(/^\d+-\(\d+\)/)||[''])[0];if(num){s.dataset.title=num;const h=s.querySelector('h1');if(h)h.textContent=num}const a=s.querySelector('.answer-badge'),c=s.querySelector('.card.correct'),x=s.querySelector('.card.wrong'),o=s.querySelector('.card.output');if(a)a.dataset.reveal='1';if(c)c.dataset.reveal='2';if(x)x.dataset.reveal='3';if(o)o.dataset.reveal='5';const tr=d.createElement('div');tr.className='translation-card';tr.dataset.reveal='4';const q=s.querySelector('.qtext')?.textContent.trim()||'';tr.innerHTML='<h2>和訳</h2><p></p>';tr.querySelector('p').textContent=translations[num]||('この大問は日本語から英文を組み立てる問題です。完成英文の意味は、問題文の日本語どおりです。'+(q?'（'+q+'）':''));s.querySelector('.grid')?.insertAdjacentElement('afterend',tr)}});const cover=slides[0],lead=cover.querySelector('.lead'),big=cover.querySelector('.big p');if(lead)lead.innerHTML='問題を見て考える → <b>クリックで正解・根拠・誤答分析・和訳・型を段階表示</b>する授業用デッキ。';if(big)big.textContent='問題スライドでは、クリック／Spaceで「正解 → 正解の根拠 → 誤答分析 → 和訳 → 再利用する型・完成英文」の順に表示します。← → キーで前後の問題へ移動できます。';const last=slides[slides.length-1],cards=last.querySelectorAll('.wide-card');if(cards[1]){const h=cards[1].querySelector('h2'),u=cards[1].querySelector('ul');if(h)h.textContent='クリック型の操作';if(u)u.innerHTML='<li>クリック1回目：正解。2回目：正解の根拠。3回目：誤答分析。4回目：和訳。5回目：再利用する型／完成英文。</li><li>Spaceキーでも同じ段階表示。← → キーで前後へ。Rキーでその問題を初期状態に戻す。</li>'}const ui=d.createElement('div');ui.className='deck-ui';ui.innerHTML='<div class="deck-progress" id="deckProgress"></div><div class="deck-step" id="deckStep"></div><div class="deck-hint" id="deckHint"></div><button class="deck-nav prev" id="prevSlide" type="button">‹</button><button class="deck-nav next" id="nextSlide" type="button">›</button>';d.body.appendChild(ui);const pg=d.getElementById('deckProgress'),se=d.getElementById('deckStep'),hi=d.getElementById('deckHint');let i=0;const labs=['問題','正解','正解の根拠','誤答分析','和訳','型・完成英文'];function fit(){const z=Math.min(w.innerWidth/1280,w.innerHeight/720);stage.style.transform=`scale(${z})`}function st(s){return Number(s.dataset.stage||0)}function mark(s,on){s.querySelectorAll('.choice').forEach(e=>e.classList.remove('is-correct'));if(!on)return;const a=s.querySelector('.answer-badge');if(!a)return;const m=a.textContent.match(/正解[：:]\s*([①②③④⑤⑥⑦⑧])/);if(!m)return;const t=[...s.querySelectorAll('.choice')].find(e=>e.textContent.trim().startsWith(m[1]));if(t)t.classList.add('is-correct')}function set(s,n){if(s.dataset.interactive!=='true')return;n=Math.max(0,Math.min(5,n));s.dataset.stage=String(n);mark(s,n>=1)}function render(){slides.forEach((s,j)=>s.classList.toggle('is-active',j===i));const s=slides[i];pg.textContent=`${i+1} / ${slides.length}`;if(s.dataset.interactive==='true'){const n=st(s);se.textContent=`${n}/5  ${labs[n]}`;hi.textContent=n<5?'クリック / Space：次の段階　← →：前後':'クリック / Space：次の問題　R：リセット'}else{se.textContent=i===0?'START':'GUIDE';hi.textContent='クリック / Space：次へ　← →：前後'}}function go(n){i=Math.max(0,Math.min(slides.length-1,n));render()}function next(){const s=slides[i];if(s.dataset.interactive==='true'&&st(s)<5){set(s,st(s)+1);render()}else go(i+1)}stage.addEventListener('click',e=>{if(!e.target.closest('button,a'))next()});d.getElementById('prevSlide').onclick=e=>{e.stopPropagation();go(i-1)};d.getElementById('nextSlide').onclick=e=>{e.stopPropagation();go(i+1)};d.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(d.activeElement?.tagName))return;if(e.code==='Space'||e.code==='Enter'){e.preventDefault();next()}else if(e.key==='ArrowRight'){e.preventDefault();go(i+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(i-1)}else if(e.key.toLowerCase()==='r'){e.preventDefault();set(slides[i],0);render()}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slides.length-1)}});w.addEventListener('resize',fit);fit();render()})})();</script></body></html>
